name: Energy

# Victorian electricity and gas plans from the AER (Consumer Data Right product data, free, no key).
on:
  schedule:
    - cron: '0 17 * * 6'   # Sun 04:00 Melbourne (AEDT): refresh plans
  workflow_dispatch:
    inputs:
      mode:
        description: 'plans = refresh plans in the database; sample = save a data sample to the energy-sample branch'
        type: choice
        options: [plans, sample]
        default: plans

permissions:
  contents: write

concurrency: energy

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plans
        if: inputs.mode != 'sample'
        run: |
          npm install --no-audit --no-fund
          export D1_DATABASE_ID=$(./scripts/d1-id.sh)
          node pipeline/energy.js 2>&1 | tee run.log
          { echo '```'; tail -n 60 run.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Sample
        if: inputs.mode == 'sample'
        run: |
          node pipeline/energy-sample.js
          git config user.name "Fair Whack" && git config user.email "beta@fairwhack.invalid"
          git checkout --orphan energy-sample
          git rm -rq --cached . && git add energy-sample && git commit -qm "Energy data sample" && git push -f origin energy-sample
