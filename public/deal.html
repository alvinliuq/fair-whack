<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#5B2BE0">
  <title>A deal shared with you · Fair Whack</title>
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap">
  <link rel="stylesheet" href="/app.css?v=44">
  <style>
    body { padding-bottom: 30px; }
    main { max-width: 560px; margin: 0 auto; padding: 14px; }
    .from { background: var(--lilac-soft); border-radius: 12px; padding: 10px 12px; font-weight: 600; margin-bottom: 12px; }
    .join { margin-top: 18px; text-align: center; }
  </style>
</head>
<body>
  <!-- FW2.2: public page for a partner deal shared outside the app (/deal?c=<campaign>&r=<sharer's friend code>). -->
  <header class="topbar"><a href="/#/" class="brand"><svg class="mark" viewBox="34 57 100 102" aria-hidden="true"><polygon points="76,59 89,79 111,66 108,91 132,101 113,115 124,138 99,134 88,157 76,136 52,145 58,119 36,106 58,92 52,68" fill="#C8F169"/><path d="M84 82v37M69 106l15 16 15-16" fill="none" stroke="#5B2BE0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Fair Whack</span></a></header>
  <main id="m"><p class="muted">Loading…</p></main>
  <script type="module">
    const q = new URLSearchParams(location.search);
    const id = q.get('c') || '', ref = q.get('r') || '';
    const m = document.getElementById('m');
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const money = (c) => (c == null ? '' : `$${(c / 100).toFixed(2)}`);
    const STORE = { woolworths: 'Woolworths', coles: 'Coles', aldi: 'ALDI', jbhifi: 'JB Hi-Fi', costco: 'Costco', kmart: 'Kmart', bunnings: 'Bunnings', petbarn: 'Petbarn', bigw: 'BIG W', chemistwarehouse: 'Chemist Warehouse', thegoodguys: 'The Good Guys', target: 'Target', officeworks: 'Officeworks', ebgames: 'EB Games', peto: 'PetO', decathlon: 'Decathlon' };
    const day = (iso) => new Date(iso).toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
    const app = `/#/brand/${encodeURIComponent(id)}`;
    const join = `/#/login?ref=${encodeURIComponent(ref)}&next=${encodeURIComponent(`brand/${id}`)}`;
    try {
      const d = await (await fetch(`/api/public/deal/${encodeURIComponent(id)}?r=${encodeURIComponent(ref)}`)).json();
      if (d.ended || d.error) throw new Error('This deal has ended');
      document.title = `${d.brand.name}: ${d.offer} · Fair Whack`;
      const logo = `<span class="blogo" style="--bc:${esc(d.brand.color || '#fff')}">${d.brand.logo ? `<img src="${esc(d.brand.logo)}" alt="${esc(d.brand.name)}">` : `<b>${esc(d.brand.name)}</b>`}</span>`;
      m.innerHTML = `
        ${d.from ? `<div class="from">${esc(d.from)} shared this deal with you</div>` : ''}
        <div class="bcard" style="max-width:none">
          <span class="bimg" style="--bc:${esc(d.brand.color || '#EFEAFF')}">${d.image ? `<img src="${esc(d.image)}" alt="">` : ''}<span class="partner">Partner</span>${logo}</span>
          <span class="btext"><b class="boffer">${esc(d.offer)}</b><span class="bmeta">${esc(d.title)} · ${esc(d.kindLabel)} · ends ${day(d.endsAt)}</span></span>
        </div>
        ${d.details ? `<div class="card" style="margin-top:12px"><p style="margin:0">${esc(d.details).replace(/\n/g, '<br>')}</p>${d.hasCode ? '<p class="small muted">There is a Fair Whack code for this deal: open it in the app to see it.</p>' : ''}</div>` : ''}
        ${d.products.length ? `<h2>Featured products</h2><div class="stack">${d.products.map((p) => `<div class="card bprod"><div class="bprod-top">${p.image ? `<div class="thumb"><img src="${esc(p.image)}" alt=""></div>` : ''}
          <div class="bprod-n"><b>${esc(p.name)}</b><span class="small">${esc(d.brand.name)} <b class="num">${money(p.price)}</b></span>
          ${p.best ? `<span class="small ${p.best.effective < (p.price ?? Infinity) ? 'hot' : 'muted'}">${STORE[p.best.retailer] || p.best.retailer} ${money(p.best.effective)}${p.best.effective < (p.price ?? Infinity) ? ' · cheaper there right now' : ''}</span>` : ''}</div></div></div>`).join('')}</div>` : ''}
        <div class="bactions">
          <a class="btn block" href="/api/go/${encodeURIComponent(d.id)}?src=share" target="_blank" rel="noopener">Go to ${esc(d.brand.host || 'the deal')} ↗</a>
          <a class="btn light block" href="${app}">Open in Fair Whack</a>
        </div>
        <div class="card join"><b>New to Fair Whack?</b><p class="small">One shopping list across Woolworths, Coles, Kmart, JB Hi-Fi and more: compare prices and get told when the things you buy go on special. Fair Whack is in private beta: ask ${d.from ? esc(d.from) : 'the person who shared this'} for an invite code.</p>
          <a class="btn ticket" href="${join}">Join with an invite code</a></div>
        <p class="small muted center">Partner deal. Partner brands may pay Fair Whack a fee or commission; it never changes search results or store comparisons.</p>`;
    } catch (e) {
      m.innerHTML = `<div class="empty"><b>${esc(e.message || 'This deal is not available')}</b><a href="/#/">Open Fair Whack</a></div>`;
    }
  </script>
</body>
</html>
